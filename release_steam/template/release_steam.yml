# Builds the mod with HEMTT and publishes it to the Steam Workshop on every release.
# Documentation: https://github.com/A3-AZ/a3_workflows/tree/main/release_steam
#
# Copy this file to .github/workflows/release_steam.yml and fill in the values below.

name: "Release: Steam"

on:
  release:
    types: [prereleased, released]

permissions:
  contents: write

# Two releases of the same repository never upload at the same time
concurrency:
  group: release-steam
  cancel-in-progress: false

jobs:
  release:
    uses: A3-AZ/a3_workflows/.github/workflows/release_steam.yml@v1
    with:
      mod-folder: '@example_mod'
      mod-name: 'Example Mod'
      workshop-id: '0000000000'
      # workshop-id-dev: '0000000000'   # optional - without it, pre-releases do nothing
      # mod-name-dev: 'Example Mod [DEV]'
      # discord-message-stable: 'Example Mod got updated! ||<@&ROLE_ID>||'   # default: 'Example Mod Stable got updated - Version 1.2.3.'
      # discord-message-dev: 'Example Mod Dev got updated! ||<@&ROLE_ID>||'
      # discord-avatar-url: 'https://raw.githubusercontent.com/<owner>/<repo>/main/img/logo.png'
      # discord-footer-icon-url: 'https://raw.githubusercontent.com/<owner>/<repo>/main/img/logo.png'
    secrets:
      steam-username: ${{ secrets.STEAM_USERNAME }}
      steam-password: ${{ secrets.STEAM_PASSWORD }}
      # optional - remove for no announcement. Either secret may be missing, e.g. one set on the
      # organization and the other on the repository. Every webhook gets the same message.
      discord-webhook: ${{ secrets.DISCORD_WEBHOOK_URL }} ${{ secrets.DISCORD_WEBHOOK_URL_EXTENDED }}
      # optional - zip with Arma 3 Tools, so HEMTT binarizes the models. Without it they are packed unbinarized.
      arma3-tools-url: ${{ secrets.ARMA3_TOOLS_URL }}
