# Composite action: runs `hemtt localization coverage` and keeps one GitHub issue updated with the report.
# Documentation and the wrapper to copy into a mod repository: update_translation_issue/README.md

name: "Update: Translation Issue"
description: Keeps one open GitHub issue updated with the localization coverage report of `hemtt localization coverage`.

inputs:
  title:
    description: Title of the issue. Matched against open issues, ignoring case. Created if no open issue has this title.
    default: Translations
  header:
    description: Text above the coverage table. Empty = no header.
    default: Translation completeness per language.
  guide-url:
    description: URL of a translation guide, linked above the table. Defaults to the ACE3 guide as a community baseline. Empty = no link.
    default: https://ace3.acemod.org/wiki/development/how-to-translate-ace3.html
  path:
    description: Folder of the HEMTT project, relative to the workspace.
    default: '.'
  dry-run:
    description: "'true' = generate the report and look up the issue, but never create or edit it."
    default: 'false'
  token:
    description: "Token for HEMTT downloads and the GitHub CLI. Needs `issues: write` unless dry-run is set."
    default: ${{ github.token }}

outputs:
  result:
    description: "What was done (or, in dry-run, would be done): created, updated or unchanged."
    value: ${{ steps.issue.outputs.result }}
  issue-number:
    description: Number of the issue. Empty if it was not created because of dry-run.
    value: ${{ steps.issue.outputs.issue-number }}
  body-file:
    description: Path of the generated issue body.
    value: ${{ steps.report.outputs.body-file }}

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        TITLE: ${{ inputs.title }}
        PROJECT_PATH: ${{ inputs.path }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        if [ -z "${TITLE// /}" ]; then
          echo "::error::Input 'title' must not be empty."
          exit 1
        fi
        if [ "$DRY_RUN" != "true" ] && [ "$DRY_RUN" != "false" ]; then
          echo "::error::Input 'dry-run' must be 'true' or 'false', got '$DRY_RUN'."
          exit 1
        fi
        if [ ! -f "$PROJECT_PATH/.hemtt/project.toml" ]; then
          echo "::error::No HEMTT project found: '$PROJECT_PATH/.hemtt/project.toml' does not exist. Check out the repository first and check the 'path' input."
          exit 1
        fi

    - name: Setup HEMTT
      uses: arma-actions/hemtt@v1
      env:
        GITHUB_TOKEN: ${{ inputs.token }} # authenticated API requests avoid rate limits

    - name: Generate the coverage report
      id: report
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        HEADER: ${{ inputs.header }}
        GUIDE_URL: ${{ inputs.guide-url }}
        BODY_FILE: ${{ runner.temp }}/translation_issue_body.md
      run: |
        set -o pipefail
        # hemtt also logs to stdout - keep only the markdown table rows
        if ! table=$(hemtt localization coverage --format markdown | grep '^|'); then
          echo "::error::'hemtt localization coverage' produced no coverage table."
          exit 1
        fi
        {
          if [ -n "$HEADER" ]; then printf '%s\n\n' "$HEADER"; fi
          if [ -n "$GUIDE_URL" ]; then printf '**[Translation guide](%s)**\n\n' "$GUIDE_URL"; fi
          printf '%s\n\n' "$table"
          # The comparison in update_issue.sh ignores this line, so a new commit alone never edits the issue
          printf '_Coverage last changed in %s_\n' "$GITHUB_SHA"
        } > "$BODY_FILE"
        cat "$BODY_FILE"
        cat "$BODY_FILE" >> "$GITHUB_STEP_SUMMARY"
        echo "body-file=$BODY_FILE" >> "$GITHUB_OUTPUT"

    - name: Create or update the issue
      id: issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        TITLE: ${{ inputs.title }}
        DRY_RUN: ${{ inputs.dry-run }}
        BODY_FILE: ${{ steps.report.outputs.body-file }}
      run: bash "$GITHUB_ACTION_PATH/scripts/update_issue.sh"
